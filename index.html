<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You Are An Idiot 😈 (Parodie)</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .idiot {
            position: absolute;
            color: lime;
            font-size: 32px;
            font-weight: bold;
            animation: move 3s linear infinite;
        }

        @keyframes move {
            0% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(200px, 150px);
            }
            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>
<body>

<script>
    function createIdiot() {
        const div = document.createElement("div");
        div.className = "idiot";
        div.textContent = "YOU ARE AN IDIOT 😜";

        div.style.left = Math.random() * window.innerWidth + "px";
        div.style.top = Math.random() * window.innerHeight + "px";
        div.style.animationDuration = (1 + Math.random() * 3) + "s";

        document.body.appendChild(div);

        // Supprime après 10 secondes (sécurité)
        setTimeout(() => {
            div.remove();
        }, 10000);
    }

    // Crée un texte toutes les 500 ms
    setInterval(createIdiot, 500);
</script>

</body>
</html>
